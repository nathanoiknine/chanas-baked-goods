<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e8">
  <title>Contact · Chana's Baked Goods</title>
  <meta name="description" content="Contact Chana Oiknine at Chana's Baked Goods. Text 413-355-3682 for orders and inquiries. Pacific Beach, San Diego.">
  <link rel="canonical" href="https://nathanoiknine.github.io/chanas-baked-goods/contact.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Italianno&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="wrap page measure-form">
      <noscript><p class="callout">Text Chana at 413-355-3682. Pacific Beach, San Diego.</p></noscript>
      <p class="kicker">Contact</p>
      <h1 id="page-title">Contact</h1>
      <p class="lede" id="page-intro">The fastest way to reach Chana is a text. The form is here if you would rather write it out.</p>
      <p class="phone-block">Text <a class="js-phone" href="sms:+14133553682">413-355-3682</a></p>
      <p class="hint">Orders and inquiries. Pacific Beach, San Diego. One-week notice for bakes. No minimum order.</p>
      <form id="contact-form" novalidate>
        <input class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-grid two">
          <label class="field"><span>Name</span><input name="name" autocomplete="name" data-remember required></label>
          <label class="field"><span>Phone</span><input name="phone" type="tel" autocomplete="tel" inputmode="tel" data-remember required></label>
          <label class="field span-2"><span>Email</span><input name="email" type="email" autocomplete="email" inputmode="email" data-remember required></label>
          <label class="field span-2"><span>Message</span><textarea name="message" maxlength="2000" required placeholder="What can Chana help with?"></textarea></label>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Send message</button>
        </div>
        <p class="form-status" id="form-status" role="alert" hidden></p>
      </form>
      <div id="confirm" class="confirm" hidden tabindex="-1"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
